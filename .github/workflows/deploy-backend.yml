name: Deploy backend to Hugging Face

# backend/ is the source of truth; the Hugging Face Space is a deploy target.
# See MIGRATION_PLAN.md Phase 2.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

env:
  HF_SPACE: alpharius6769/Pocket_Reader

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # curated_library PDFs are LFS objects. They are NOT synced by this
          # workflow (see the rsync excludes below), so CI never needs to pull
          # them and never spends metered LFS bandwidth.
          lfs: false
          submodules: false

      - name: Require HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Add a Hugging Face write token at"
            echo "::error::Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Clone the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-space

      - name: Sync backend/ into the Space
        run: |
          # Excludes, and why:
          #   tools/, reports/ - maintainer-only, explicitly not runtime app code
          #   .wrangler/       - local Cloudflare credential cache, must never leave this machine
          #   __pycache__/     - build artefact
          #   curated_library/ - large LFS PDFs that change rarely; synced manually
          #                      so routine backend deploys cost no LFS bandwidth
          #   .git/            - never clobber the Space's own history
          #   .gitignore       - the Space keeps its own
          rsync -av --delete \
            --exclude='tools/' \
            --exclude='reports/' \
            --exclude='.wrangler/' \
            --exclude='__pycache__/' \
            --exclude='curated_library/' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            backend/ hf-space/

      - name: Fail if a secret-shaped file slipped through
        run: |
          if find hf-space -type f \
               \( -name '*.env' -o -name '*wrangler-account*' -o -name '*.pem' \
                  -o -name '*.key' -o -name '*credential*' \) \
               -not -path '*/.git/*' | grep -q .; then
            echo "::error::Refusing to publish: a credential-shaped file is staged for a PUBLIC Space."
            find hf-space -type f \( -name '*.env' -o -name '*wrangler-account*' \
              -o -name '*.pem' -o -name '*.key' -o -name '*credential*' \) -not -path '*/.git/*'
            exit 1
          fi

      - name: Commit and push
        id: push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: hf-space
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Space already matches backend/ -- nothing to deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git status --short
          git commit -m "Sync backend from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git push
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A plain /api/health poll is NOT sufficient: immediately after a push the
      # Space reports stage RUNNING_BUILDING and the OLD container keeps serving
      # 200s, so health alone goes green while a broken build is still cooking.
      # Gate on the Spaces API instead: the Space must be on the commit we just
      # pushed AND in terminal stage RUNNING, and only then do we probe health.
      - name: Wait for the Space to rebuild onto the pushed commit
        if: steps.push.outputs.deployed == 'true'
        env:
          TARGET_SHA: ${{ steps.push.outputs.sha }}
        run: |
          API="https://huggingface.co/api/spaces/${HF_SPACE}"
          for i in $(seq 1 40); do
            body=$(curl -sf "$API" || true)
            stage=$(echo "$body" | jq -r '.runtime.stage // "UNKNOWN"')
            sha=$(echo   "$body" | jq -r '.sha // ""')

            case "$stage" in
              BUILD_ERROR|RUNTIME_ERROR|CONFIG_ERROR|NO_APP_FILE)
                echo "::error::Space entered $stage. Check the build logs at"
                echo "::error::https://huggingface.co/spaces/${HF_SPACE}?logs=build"
                exit 1
                ;;
            esac

            if [ "$sha" = "$TARGET_SHA" ] && [ "$stage" = "RUNNING" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://alpharius6769-pocket-reader.hf.space/api/health" || true)
              if [ "$code" = "200" ]; then
                echo "Space is RUNNING on ${sha:0:7} and healthy."
                exit 0
              fi
              echo "attempt ${i}: RUNNING on target commit but health returned ${code:-none}"
            else
              echo "attempt ${i}: stage=${stage} sha=${sha:0:7} (want RUNNING on ${TARGET_SHA:0:7})"
            fi
            sleep 20
          done
          echo "::error::Space did not reach RUNNING on ${TARGET_SHA:0:7} within ~13 minutes."
          exit 1
