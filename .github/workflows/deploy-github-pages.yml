name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # v2: the site is a build. web/ (Svelte) bundles into dist/, with public/
      # (cores, workers, sw.js, fonts, sprites) copied in unbundled; the build
      # also writes the bundle's hashed files into dist/sw.js's precache.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build the app
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
