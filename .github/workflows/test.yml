name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The curated_library PDFs are the only LFS objects in this repo and
          # no test reads them. Leaving LFS off keeps CI off the metered
          # GitHub LFS bandwidth quota entirely.
          lfs: false
          # "Hugging Face Space" is a bare gitlink with no .gitmodules;
          # fetching submodules would fail. No test reads it -- assertions run
          # against backend/, which is the source of truth.
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Note: `node --test tests/` chokes on the .py files and __pycache__ in
      # that directory, so the glob is deliberate.
      - name: Run test suite
        run: node --test tests/*.test.mjs

      - name: Check service-worker parity
        run: node --test tests/migration_parity.test.mjs

      # These two guards existed but nothing ran them, so they only fired when
      # someone remembered to. That is how tools/test_caching_playback_browser.mjs
      # sat on buffer-v54 and storage-v13 for weeks while production shipped v58
      # and v14 -- a harness importing modules that no longer existed. Both are
      # fast and deterministic; run them on every push.
      - name: Check module version alignment
        run: node tools/check_module_versions.mjs

      - name: Verify release parity
        run: node tools/verify_release_parity.mjs

      # backend_security_regressions.py imports backend/app.py, which pulls in
      # FastAPI and aiosqlite, so the backend deps are required and not optional.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend regression suites
        run: python -m unittest discover -s tests -p "*_regressions.py" -v
