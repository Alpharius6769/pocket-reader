name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The curated_library PDFs are the only LFS objects in this repo and
          # no test reads them. Leaving LFS off keeps CI off the metered
          # GitHub LFS bandwidth quota entirely.
          lfs: false
          # anvil-app and "Hugging Face Space" are bare gitlinks with no
          # .gitmodules; fetching submodules would fail. Tests that read them
          # skip themselves when absent.
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Note: `node --test tests/` chokes on the .py files and __pycache__ in
      # that directory, so the glob is deliberate.
      - name: Run test suite
        run: node --test tests/*.test.mjs

      - name: Check service-worker parity
        run: node --test tests/migration_parity.test.mjs
