metadata: {description: A private offline-capable story reader with Pocket TTS narration and optional cross-device profile sync., logo_img: 'asset:pocket_reader_icon-logo.jpeg', title: Alpharius' Pocket Reader}
name: Alpharius' Pocket Reader (WIP Name)
native_deps: {head_html: ''}
package_name: Alpharius_Pocket_Reader
renamed: true
runtime_options:
  client_version: '3'
  legacy_features: {bootstrap3: true, class_names: true}
  server_spec: {base: python310-standard}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: true, enable_automatically: true, remember_me_days: 365, use_email: true, use_google: true, use_token: true}
  server_config:
    email_content:
      confirm_address:
        html: |-
          <p>Welcome to Alpharius' Pocket Reader.</p>
          <p>Confirm your email address to enable private profile sync across your devices:</p>
          <p>{{confirm_link}}</p>
          <p>If you did not create this account, you can ignore this message.</p>
          <p>Pocket Reader</p>
      reset_password:
        html: |-
          <p>A password reset was requested for your Pocket Reader account {{email}}.</p>
          <p>Use the link below to choose a new password:</p>
          <p>{{reset_link}}</p>
          <p>This link will expire in ten minutes.</p>
          <p>If you did not request this reset, you can ignore this message.</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: FrontEnd, type: form}
startup_form: null
