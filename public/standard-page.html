<!doctype html>
<html lang="en">
<head>
<!-- ==========================================
0. FORCED FIRST-RUN RESET
   Runs BEFORE every other script so nothing can read stale state or write it
   back mid-wipe. Bump PR_RESET_TOKEN to force every returning user through a
   clean first run again; leaving it unchanged is a no-op after the first pass.
========================================== -->
<script>
(function () {
  var PR_RESET_TOKEN = 'reset-2026-09-04';
  var DONE_KEY = 'pr_forced_reset_v1';
  var TRY_KEY = 'pr_forced_reset_attempts_v1';
  var MAX_ATTEMPTS = 2;

  var done, attempts;
  try {
    done = localStorage.getItem(DONE_KEY);
    attempts = parseInt(localStorage.getItem(TRY_KEY) || '0', 10) || 0;
  } catch (e) {
    return;   // No storage access (private mode): nothing to reset.
  }
  if (done === PR_RESET_TOKEN) return;

  // A wipe that keeps failing must not trap the user in a reload loop. After
  // MAX_ATTEMPTS, mark it done and let the app boot on whatever survived.
  if (attempts >= MAX_ATTEMPTS) {
    try { localStorage.setItem(DONE_KEY, PR_RESET_TOKEN); } catch (e) {}
    return;
  }
  try { localStorage.setItem(TRY_KEY, String(attempts + 1)); } catch (e) {}

  document.documentElement.style.background = '#12151c';
  var notice = 'Updating Pocket Reader…';
  try {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML =
        '<div style="position:fixed;inset:0;display:flex;align-items:center;'
        + 'justify-content:center;background:#12151c;color:#e6e8ee;'
        + 'font:500 15px/1.5 system-ui,sans-serif;text-align:center;padding:24px">'
        + notice + '</div>';
    });
  } catch (e) {}

  function deleteDatabases() {
    // indexedDB.databases() is unsupported on Firefox and older Safari, so the
    // known name is always deleted as well rather than relying on enumeration.
    var names = ['PocketReaderDB'];
    var listing = (indexedDB.databases
      ? indexedDB.databases().then(function (dbs) {
          (dbs || []).forEach(function (d) {
            if (d && d.name && names.indexOf(d.name) === -1) names.push(d.name);
          });
        }).catch(function () {})
      : Promise.resolve());
    return listing.then(function () {
      return Promise.all(names.map(function (name) {
        return new Promise(function (resolve) {
          var req;
          try { req = indexedDB.deleteDatabase(name); } catch (e) { return resolve(); }
          req.onsuccess = req.onerror = function () { resolve(); };
          // A live connection in another tab blocks the delete indefinitely.
          req.onblocked = function () { resolve(); };
          setTimeout(resolve, 4000);
        });
      }));
    });
  }

  function deleteCaches() {
    if (!self.caches || !caches.keys) return Promise.resolve();
    return caches.keys().then(function (names) {
      return Promise.all(names.map(function (n) { return caches.delete(n); }));
    }).catch(function () {});
  }

  function clearStorage() {
    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}
  }

  function unregisterWorkers() {
    // The active service worker already ran its install, so it will not
    // re-populate the app-shell cache this block is about to delete. Dropping
    // the registration makes the next load install a fresh one that does.
    if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) {
      return Promise.resolve();
    }
    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
    }).catch(function () {});
  }

  Promise.resolve()
    .then(deleteDatabases)
    .then(deleteCaches)
    .then(unregisterWorkers)
    .then(function () {
      clearStorage();
      // Written AFTER the wipe, so an interrupted reset retries on next boot.
      try { localStorage.setItem(DONE_KEY, PR_RESET_TOKEN); } catch (e) {}
    })
    .catch(function () {
      try { localStorage.setItem(DONE_KEY, PR_RESET_TOKEN); } catch (e) {}
    })
    .then(function () {
      // Reload so every module boots against empty storage and the first-run
      // modals appear, rather than against the half-torn-down state above.
      location.replace(location.pathname + location.search + location.hash);
    });
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    A leftover route from the Anvil host, kept only so an old bookmark or an
    indexed link still lands somewhere useful.

    Both redirects below resolve against this file's own directory, NOT the
    server root. Production is served from a subpath
    (alpharius6769.github.io/pocket-reader/), so the literal "/" this used to
    use sent visitors to the account root instead of the app -- the same trap
    sw.js documents at SHELL_URL and fixes everywhere else.
  -->
  <meta http-equiv="refresh" content="0; url=./">
  <title>Pocket Reader</title>
  <script>
    (function () {
      var target = new URL('./', document.baseURI).href + location.search + location.hash;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Opening <a href="./">Pocket Reader</a>…</p>
</body>
</html>
