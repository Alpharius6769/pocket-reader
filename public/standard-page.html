<!-- ==========================================
2a. FAST-NARRATION RELOAD MASK (anti-flash)
========================================== -->
<!--
Unlocking multi-threaded narration needs a one-time reload with ?tts_fast=1
(cross-origin isolation cannot be enabled without navigating). That reload
reboots the app, which briefly lands on the default Home view before the reader
is restored — the visible white/Home flash users reported. The JS "resuming"
overlay only paints after the narration runtime lazy-loads, too late to cover
the gap. This inline, synchronous mask paints on the very first frame whenever a
reload is actively resuming (a resume record is pending) and self-removes the
instant the app leaves Home (reader/settings/etc.) or the JS overlay takes over.
Fully self-contained so no versioned module needs to change.
-->
<style>
#pr-iso-mask{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:var(--app-bg,#111214);color:var(--text-main,#e8e8ea);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:opacity .25s ease}
#pr-iso-mask.pr-iso-hide{opacity:0}
#pr-iso-mask .pr-iso-card{text-align:center;padding:0 24px}
#pr-iso-mask .pr-iso-spinner{width:44px;height:44px;margin:0 auto 16px;border:4px solid rgba(128,128,128,.28);border-top-color:var(--accent-blue-text,#4a9eff);border-radius:50%;animation:pr-iso-spin .8s linear infinite}
#pr-iso-mask .pr-iso-text{font-size:1rem;opacity:.85;color:var(--text-main,#e8e8ea)}
@keyframes pr-iso-spin{to{transform:rotate(360deg)}}
</style>
<script>
(function () {
  try {
    if (new URLSearchParams(location.search).get('tts_fast') !== '1') return;
    // Only mask when a reload is actively resuming somewhere (story narration or
    // backend optimization). A bare ?tts_fast=1 reload with nothing pending just
    // stays on Home, so masking would be wrong.
    var pending = sessionStorage.getItem('pr_fast_narration_resume_v1')
               || sessionStorage.getItem('pr_backend_optimization_resume_v1');
    if (!pending) return;

    var mask = document.createElement('div');
    mask.id = 'pr-iso-mask';
    mask.setAttribute('role', 'status');
    mask.setAttribute('aria-live', 'polite');
    mask.innerHTML = '<div class="pr-iso-card"><div class="pr-iso-spinner"></div><div class="pr-iso-text">Unlocking fast narration…</div></div>';

    var removed = false, obs = null;
    var clear = function () {
      if (removed) return;
      removed = true;
      if (obs) { try { obs.disconnect(); } catch (e) {} }
      mask.classList.add('pr-iso-hide');
      setTimeout(function () { if (mask.parentNode) mask.parentNode.removeChild(mask); }, 300);
    };
    window.__prClearIsoMask = clear;

    // Clear the moment the app leaves Home — any non-Home view going active
    // (reader, settings, library, away…) or the JS "resuming" overlay taking
    // over means the reboot gap is covered from here on.
    var check = function () {
      var ov = document.getElementById('global-loading-overlay');
      if (ov && ov.classList.contains('active')) { clear(); return true; }
      var active = document.querySelector('.view.active-view');
      if (active && active.id && active.id !== 'home-view') { clear(); return true; }
      return false;
    };
    var start = function () {
      // Apply the saved theme class up-front so the mask's var(--app-bg) /
      // var(--text-main) resolve to the user's theme (not the dark default) on
      // the first frame — otherwise a light-theme user would get a dark mask. The
      // app re-applies the same class during boot, so this is idempotent.
      try {
        var t = (((JSON.parse(localStorage.getItem('pocketReaderData') || '{}') || {}).settings) || {}).theme || 'slate';
        t = String(t).replace(/[^a-z]/g, '').slice(0, 20);
        if (t && t !== 'dark' && document.body) document.body.classList.add('theme-' + t);
      } catch (e) {}
      (document.body || document.documentElement).appendChild(mask);
      if (check()) return;
      obs = new MutationObserver(check);
      try { obs.observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['class'] }); } catch (e) {}
    };
    if (document.body) start();
    else document.addEventListener('DOMContentLoaded', start, { once: true });

    // Safety backstop: never trap the user behind the mask if a resume stalls.
    // The JS "resuming" overlay sits underneath and keeps Home covered if the
    // resume is genuinely still in flight when this fires.
    setTimeout(clear, 10000);
  } catch (e) { /* URL/sessionStorage/DOM unavailable — skip the mask */ }
})();
</script>

<!-- ==========================================
2b. MODULE PRELOAD (flatten the ES-module waterfall)
========================================== -->
<!--
The FrontEnd form loads its JS as an ES-module graph (both via <script type=module>
in the form HTML and via anvil.js.import_from at form init). Because those modules
are only discovered once the Skulpt runtime boots and parses each parent module,
they otherwise download in a serial waterfall that gates first paint / LCP.
These hints let the browser start fetching the render-critical modules in parallel
during initial HTML parse, before the runtime asks for them. URLs (and ?v= query
strings) MUST match the script-tag / import_from URLs exactly, or the browser
double-fetches. audio_core, buffer_manager and tts_pronunciation_core are
intentionally omitted: they are only needed for playback, so leaving them to load
after paint keeps them from competing with the render-critical modules.
-->
<link rel="modulepreload" href="_/theme/diagnostics.js?v=diag-v4">
<link rel="modulepreload" href="_/theme/motion_lite.js">
<link rel="modulepreload" href="_/theme/storage_core.js?v=storage-v6">

<link rel="modulepreload" href="_/theme/engine_utils.js">

<!-- ==========================================
3. SERVICE WORKER REGISTRATION
========================================== -->
<!-- Registers the background worker immediately so assets cache on the first visit -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      if (window.location.pathname.startsWith('/debug/') || window.__prServiceWorkerRegistration) return;
      // Share one registration promise with ui_controller so first load does
      // not race two registrations or emit duplicate failures.
      window.__prServiceWorkerRegistration = navigator.serviceWorker
        .register('/_/api/serviceworker.js?v=129', { scope: '/' })
        .catch(function() {
          return navigator.serviceWorker.register('/_/api/serviceworker.js', { scope: '/' });
        })
        .then(function(registration) {
          console.log('Service Worker registered with scope:', registration.scope);
          window.__prServiceWorkerError = null;
          return registration;
        })
        .catch(function(error) {
          window.__prServiceWorkerError = {
            name: error && error.name ? error.name : 'Error',
            message: error && error.message ? error.message : String(error)
          };
          console.error('Service Worker registration failed:', error);
          return null;
        });
    });
  }
</script>
