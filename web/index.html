<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7ebef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b2027" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pocket Reader" />
    <meta name="description" content="Stories, read aloud on your phone." />
    <!-- GitHub Pages sends no custom headers, so public/_headers never reaches
         a browser there. This meta is the only way to set the policy. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Square, opaque, 180px: what iOS asks for. The JPEG it replaced was
         503x512, which iOS scales out of shape for the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/img/apple-touch-icon.png" />
    <link rel="preload" href="./assets/fonts/literata-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pocket Reader</title>
  </head>
  <body>
    <!-- Shown until the app has loaded its cores and mounted. Inline on
         purpose: it has to paint before any script or stylesheet arrives. -->
    <style>
      .boot { background: #e7ebef; color: #1a2027; }
      @media (prefers-color-scheme: dark) { .boot { background: #1b2027; color: #e9edf1; } }
      .boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; }
      .boot img { border-radius: 18px; }
      .boot-title { margin: 6px 0 0; font-weight: 700; font-size: 20px; }
      .boot-sub { margin: 0; opacity: 0.7; max-width: 30ch; }
      .boot-retry { margin-top: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #9b1c24; color: #fff; font: inherit; font-weight: 600; }
    </style>
    <div id="app">
      <div class="boot" role="status">
        <img src="./assets/img/pocket_reader_icon.webp" alt="" width="72" height="72" />
        <p class="boot-title">Pocket Reader</p>
        <p class="boot-sub">Opening your library…</p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
