name = "pocket-reader-proxy"
main = "cloudflare_worker.js"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Additive: cloudflare_worker.js resolveAllowedOrigin() also hardcodes the two
# .anvil.app origins as defaults. Both the hardcoded list and this variable are
# stripped of Anvil entries when Anvil is deleted (MIGRATION_PLAN.md Phase 5).
ALLOWED_ORIGINS = "https://pocket-reader-f2y.pages.dev,https://phase3-preview.pocket-reader-f2y.pages.dev,https://hot-wiry-raven.anvil.app"
ALLOWED_PROXY_HOSTS = "archiveofourown.org,fichub.net"
CHAPTER_SYNC_URL = "https://alpharius6769-pocket-reader.hf.space/api/sync/chapters"

[triggers]
crons = ["17,47 * * * *"]

# Smart placement routes the worker close to the target server for faster fetch times
[placement]
mode = "smart"
