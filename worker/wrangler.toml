name = "pocket-reader-proxy"
main = "cloudflare_worker.js"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
# Additive to the defaults in cloudflare_worker.js resolveAllowedOrigin(), which
# is why the two pocket-reader-f2y.pages.dev entries had to come out of BOTH
# places: dropping them from the code alone would have left this var adding them
# straight back. Both names are NXDOMAIN since the Pages project was removed, and
# an unowned *.pages.dev name can be claimed by creating a Pages project with it
# -- which would have handed the claimant CORS access to /api/ (forwarded with
# HF_TOKEN) and /catalog-api/ (written with CATALOG_PROXY_KEY).
ALLOWED_ORIGINS = "https://alpharius6769.github.io"
# Set to "1" only for local development. Production must not reflect CORS for
# arbitrary localhost origins.
ALLOW_LOCALHOST_ORIGINS = "0"
ALLOWED_PROXY_HOSTS = "archiveofourown.org,fichub.net"
# The Worker also exposes /catalog-api/*, which re-origins the Anthronomicon
# community-snapshot, rate, click and story-metadata routes. It needs no var of
# its own -- it is gated on an allowed browser Origin or X-Pocket-Proxy-Key, so
# it does not widen the allowlist above. Curator/Turnstile routes are not
# proxied, and the native build cannot use the route yet.

# Endpoint for the scheduled chapter-refresh sweep (see [triggers] below).
CHAPTER_SYNC_URL = "https://alpharius6769-pocket-reader.hf.space/api/sync/chapters"

# IMPORTANT: The following secrets must be set via `wrangler secret put <NAME>`:
# - HF_TOKEN: Hugging Face read token to access the private Space backend.
# - ADMIN_PUSH_SECRET: Token for the cron push delivery triggers.
# - PROXY_AUTH_TOKEN: (Optional) Token for the backend hop and non-browser callers.
#   The Worker also accepts WORKER_PROXY_TOKEN as an alias so the Space secret
#   and the Worker secret can share a name. Header: X-Pocket-Proxy-Key.
#   Do not rename a production secret that is already set.
# - APP_PROXY_TOKEN: (Optional) The packaged Capacitor build's own credential,
#   sent in the same X-Pocket-Proxy-Key header. Unset means inert: the app-key
#   path authorises nobody, which is the correct state until an APK is actually
#   cut. It is deliberately NOT PROXY_AUTH_TOKEN -- this value ships inside an
#   installable binary, so it is extractable and is a cost barrier rather than a
#   secret. Keeping it separate means a leak is rotated here alone and never
#   confers the backend hop's identity. Inject the matching value into the
#   COPIED build assets with tools/inject_native_app_key.mjs after `npx cap
#   sync`; it must never be committed to public/, which GitHub Pages publishes.

[triggers]
crons = ["17,47 * * * *"]

# Smart placement routes the worker close to the target server for faster fetch times
[placement]
mode = "smart"
